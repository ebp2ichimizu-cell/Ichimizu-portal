<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>海外EBPナビ βテスト用アクセス案内</title>

  <style>
    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f7f3;
      color: #303029;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 20px;
    }

    .box {
      background: #ffffff;
      border: 1px solid #e4e3d9;
      border-radius: 18px;
      padding: 32px 24px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 24px;
    }

    p {
      line-height: 1.8;
      margin: 0 0 18px;
    }

    .button {
      display: block;
      margin: 28px 0;
      padding: 14px 18px;
      text-align: center;
      background: #4b4b40;
      color: white;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
    }

    .note {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e4e3d9;
      color: #6b6b60;
      font-size: 13px;
      line-height: 1.8;
    }

    .back {
      margin-top: 24px;
      text-align: center;
    }

    .back a {
      color: #4b4b40;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="box">

      <h1>
        海外EBPナビ βテスト用アクセス案内
      </h1>

      <p>
        海外EBPナビは現在βテスト中です。
      </p>

      <p>
        以下のPDFを開き、記載されているURLから
        β版サイトへアクセスしてください。
      </p>

      <a
        class="button"
        href="【パスワード付きPDFのURL】"
        target="_blank"
        rel="noopener noreferrer"
      >
        βテスト用アクセスPDFを開く
      </a>

      <div class="note">
        ※PDFの閲覧にはパスワードが必要です。<br>
        ※PDFに記載されたURLはβテスト参加者限定です。<br>
        ※URL・PDF・パスワードの第三者への転送・共有はお控えください。
      </div>

    </div>

    <div class="back">
      <a href="./">
        ← ポータルへ戻る
      </a>
    </div>

  </main>

</body>
</html>
