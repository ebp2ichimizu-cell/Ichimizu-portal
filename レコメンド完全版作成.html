<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いちみず会 レコメンド更新</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 18px;line-height:1.8}button{font-size:1rem;padding:14px 20px;background:#172b4d;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:12px;border-radius:8px}</style><h1>レコメンド追加（Vol.1・2）</h1><p>GitHubの公開済み <code>recommendations.json</code> を読み込み、既存の項目を残したまま2件を追加した完全版ファイルをダウンロードします。</p><button id="go">完全版 recommendations.json を作成</button><p id="status"></p><p>作成したファイルを GitHub の <code>Ichimizu-portal</code> リポジトリのルートにある同名ファイルへ上書きしてください。</p><script>const added=[{"id": "column-013", "title_ja": "空想EBP読本 Vol.1", "title_en": "Imagining Evidence-Based Policing, Vol. 1", "summary_ja": "医療・公衆衛生分野の実験を手がかりに、「情報を伝えること」と「実際に行動してもらうこと」の違いを考察。防犯アプリや自転車施錠を例に、行動しない理由に応じた介入と、その効果検証を考えます。", "summary_en": "Drawing on experiments in health and public health, this column examines the gap between providing information and changing behavior. It considers interventions tailored to barriers to action, using crime-prevention apps and bicycle locking as examples, and how their effects might be evaluated.", "url_ja": "https://sites.google.com/view/ichimizu-crime-prevention/home/column/essay/%E7%A9%BA%E6%83%B3ebp%E8%AA%AD%E6%9C%AC-vol-1", "url_en": "https://sites.google.com/view/ichimizu-crime-prevention/home/column/essay/%E7%A9%BA%E6%83%B3ebp%E8%AA%AD%E6%9C%AC-vol-1", "category_ja": "EBP2", "category_en": "EBP", "active": true}, {"id": "column-014", "title_ja": "空想EBP読本 Vol.2", "title_en": "Imagining Evidence-Based Policing, Vol. 2", "summary_ja": "社会規範を用いた電力消費の実験を手がかりに、「みんながやっている」という情報が人の行動をどう変えるかを考察。ブーメラン効果にも注目し、防犯広報では平均的な効果だけでなく「誰の行動がどう変わったか」を見る重要性を考えます。", "summary_en": "Using experiments on social norms and electricity consumption, this column explores how messages about what others do may influence behavior, including possible boomerang effects. It considers why crime-prevention communication should examine whose behavior changes, not just average effects.", "url_ja": "https://sites.google.com/view/ichimizu-crime-prevention/home/column/essay/%E7%A9%BA%E6%83%B3ebp%E8%AA%AD%E6%9C%AC-vol-2", "url_en": "https://sites.google.com/view/ichimizu-crime-prevention/home/column/essay/%E7%A9%BA%E6%83%B3ebp%E8%AA%AD%E6%9C%AC-vol-2", "category_ja": "EBP2", "category_en": "EBP", "active": true}];const source='https://raw.githubusercontent.com/ebp2ichimizu-cell/Ichimizu-portal/main/recommendations.json';document.getElementById('go').onclick=async()=>{const s=document.getElementById('status');s.textContent='既存ファイルを読み込み中…';try{const r=await fetch(source+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('GitHubの読み込みに失敗: '+r.status);const data=await r.json();if(!Array.isArray(data.ichimizu_columns)||!Array.isArray(data.daily_brief))throw Error('想定外のJSON形式です');const before=data.ichimizu_columns.length;for(const item of added){const i=data.ichimizu_columns.findIndex(x=>x.id===item.id);if(i>=0)data.ichimizu_columns[i]=item;else data.ichimizu_columns.push(item)}const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='recommendations.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);s.textContent='作成完了：既存コラム '+before+'件、更新後 '+data.ichimizu_columns.length+'件。Daily Brief '+data.daily_brief.length+'件は保持しました。'}catch(e){s.textContent='作成できませんでした：'+e.message+'。既存ファイルは変更されていません。'}};</script></html>
