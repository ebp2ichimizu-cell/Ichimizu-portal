<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#4b4b40">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>EBP2 - いちみず会</title>

  <style>
    :root {
      --bg: #f7f7f3;
      --card: #ffffff;
      --text: #303029;
      --muted: #6b6b60;
      --accent: #b7b463;
      --dark: #4b4b40;
      --border: #e4e3d9;
      --soft: #efeee5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-logo {
      width: 116px;
      height: 116px;
      object-fit: cover;
      border-radius: 24px;
      margin: 0 auto 16px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .language {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .language button {
      border: 1px solid var(--border);
      background: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .language button.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    .section-title {
      margin: 28px 4px 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
    }

    .meeting-card,
    .recommendation-card,
    .card,
    .share-card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(0,0,0,0.035);
    }

    .meeting-card {
      border-radius: 20px;
      padding: 22px;
    }

    .meeting-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .meeting-date {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .meeting-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .meeting-list {
      margin: 0;
      padding-left: 20px;
      line-height: 1.7;
      font-size: 14px;
    }

    .meeting-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .meeting-button {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
    }

    .meeting-button.primary {
      background: var(--dark);
      color: #ffffff;
    }

    .meeting-button.secondary {
      background: var(--soft);
      color: var(--text);
    }

    .recommendations-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .recommendation-card {
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      padding: 20px;
      min-height: 100%;
    }

    .recommendation-type {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .recommendation-date {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .recommendation-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 9px;
    }

    .recommendation-summary {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      flex: 1;
    }

    .recommendation-link {
      display: inline-block;
      align-self: flex-start;
      margin-top: 14px;
      color: var(--dark);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid var(--dark);
      padding-bottom: 2px;
    }

    .recommendation-card:hover,
    .card:hover {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      display: block;
      border-radius: 18px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
    }

    .card.preparing {
      opacity: 0.72;
      cursor: default;
    }

    .card.preparing:hover {
      border-color: var(--border);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
    }

    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .tag,
    .preparing-label {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
    }

    .tag {
      background: var(--soft);
      color: var(--muted);
    }

    .preparing-label {
      border: 1px solid var(--border);
      background: #ffffff;
      font-weight: 700;
      color: var(--dark);
    }

    .updated {
      width: 100%;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
      font-size: 14px;
      padding: 8px 4px;
    }

    .share-box {
      margin-top: 30px;
    }

    .share-card {
      border-radius: 18px;
      padding: 22px;
      text-align: center;
    }

    .qr-code {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .share-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (min-width: 640px) {
      .grid,
      .recommendations-grid {
        grid-template-columns: 1fr 1fr;
      }

      .meeting-buttons {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <img
        src="IMG_2260.png"
        alt="いちみず会 EBP2 ロゴ"
        class="app-logo"
      >

      <h1>EBP2 - いちみず -</h1>

      <div class="subtitle" id="app-description">
        いちみず会関連サイトへのポータル
      </div>

      <div class="language">
        <button id="ja-btn" class="active" type="button">
          日本語
        </button>

        <button id="en-btn" type="button">
          English
        </button>
      </div>
    </header>

    <section id="meeting-section" hidden>
      <div class="section-title" id="meeting-section-title">
        次回のいちみず会
      </div>

      <div class="meeting-card">
        <div class="meeting-name" id="meeting-name"></div>
        <div class="meeting-date" id="meeting-date"></div>

        <div class="meeting-label" id="theme-label">
          テーマ
        </div>

        <ul class="meeting-list" id="meeting-themes"></ul>

        <div class="meeting-label" id="presenter-label">
          報告者
        </div>

        <ul class="meeting-list" id="meeting-presenters"></ul>

        <div class="meeting-buttons">
          <a
            id="zoom-button"
            class="meeting-button primary"
            target="_blank"
            rel="noopener noreferrer"
          >
            Zoomで参加
          </a>

          <a
            id="chat-button"
            class="meeting-button secondary"
            target="_blank"
            rel="noopener noreferrer"
          >
            ミーティングチャット
          </a>
        </div>
      </div>
    </section>

    <section id="recommendations-section">
      <div class="section-title" id="recommendations-section-title">
        おすすめ
      </div>

      <div id="recommendations-grid" class="recommendations-grid">
        <div class="loading">読み込み中...</div>
      </div>
    </section>

    <div class="section-title" id="main-sites-title">
      主要サイト
    </div>

    <section id="sites-grid" class="grid">
      <div class="loading">読み込み中...</div>
    </section>

    <section class="share-box">
      <div class="section-title" id="share-section-title">
        このポータルを共有
      </div>

      <div class="share-card">
        <img
          src="portal-qr.png"
          alt="EBP2 ポータル QRコード"
          class="qr-code"
        >

        <div class="share-text" id="share-text">
          QRコードからこのポータルを開けます。
        </div>
      </div>
    </section>

    <footer>
      <div id="footer-text">
        Evidence-Based Policing・犯罪予防の学習と情報共有のためのポータル
      </div>
    </footer>

  </main>

  <script>
    let currentLanguage =
      localStorage.getItem("language") || "ja";

    let meetingData = null;
    let sitesData = [];
    let recommendationsData = {
      ichimizu_columns: [],
      daily_brief: []
    };

    const translations = {
      ja: {
        description: "いちみず会関連サイトへのポータル",
        meetingTitle: "次回のいちみず会",
        themeLabel: "テーマ",
        presenterLabel: "報告者",
        zoomButton: "Zoomで参加",
        chatButton: "ミーティングチャット",
        recommendationsTitle: "おすすめ",
        columnType: "いちみず会おすすめコラム",
        dailyType: "最近の EBP Daily Brief",
        readMore: "読む",
        sitesTitle: "主要サイト",
        preparingLabel: "準備中",
        updatedLabel: "最終更新",
        shareTitle: "このポータルを共有",
        shareText: "QRコードからこのポータルを開けます。",
        footer:
          "Evidence-Based Policing・犯罪予防の学習と情報共有のためのポータル",
        loadingRecommendations: "おすすめを読み込み中...",
        errorRecommendations: "おすすめを読み込めませんでした。",
        loadingSites: "サイト一覧を読み込み中...",
        errorSites: "サイト一覧を読み込めませんでした。"
      },

      en: {
        description: "Portal for Ichimizu-kai related websites",
        meetingTitle: "Next Ichimizu-kai meeting",
        themeLabel: "Topics",
        presenterLabel: "Presenters",
        zoomButton: "Join Zoom",
        chatButton: "Meeting chat",
        recommendationsTitle: "Recommended",
        columnType: "Recommended Ichimizu-kai Column",
        dailyType: "Recent EBP Daily Brief",
        readMore: "Read",
        sitesTitle: "Sites",
        preparingLabel: "Coming soon",
        updatedLabel: "Last updated",
        shareTitle: "Share this portal",
        shareText: "Open this portal from the QR code.",
        footer:
          "A portal for learning and sharing information on Evidence-Based Policing and crime prevention.",
        loadingRecommendations: "Loading recommendations...",
        errorRecommendations: "Could not load recommendations.",
        loadingSites: "Loading sites...",
        errorSites: "Could not load the site list."
      }
    };

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        if (
          url.protocol === "https:" ||
          url.protocol === "http:"
        ) {
          return url.href;
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    function getJapanDateKey() {
      const formatter =
        new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        });

      return formatter.format(new Date());
    }

    function stringHash(value) {
      let hash = 0;

      for (let i = 0; i < value.length; i++) {
        hash =
          ((hash << 5) - hash + value.charCodeAt(i)) |
          0;
      }

      return Math.abs(hash);
    }

    function selectDailyItem(items, key) {
      if (!items.length) {
        return null;
      }

      const index =
        stringHash(key) % items.length;

      return items[index];
    }

    function formatDate(dateString) {
      if (!dateString) {
        return "";
      }

      const parts = dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      const year = parts[0];
      const month = Number(parts[1]);
      const day = Number(parts[2]);

      if (currentLanguage === "ja") {
        return `${year}.${month}.${day}`;
      }

      const date =
        new Date(
          `${dateString}T00:00:00+09:00`
        );

      return new Intl.DateTimeFormat(
        "en-US",
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          timeZone: "Asia/Tokyo"
        }
      ).format(date);
    }

    function getRecentDailyBriefItems(items) {
      const activeItems =
        items.filter(item => item.active !== false);

      if (!activeItems.length) {
        return [];
      }

      const validDates =
        activeItems
          .map(item => item.date)
          .filter(Boolean)
          .sort();

      if (!validDates.length) {
        return activeItems;
      }

      const latestDate =
        validDates[validDates.length - 1];

      const latest =
        new Date(
          `${latestDate}T00:00:00+09:00`
        );

      const cutoff =
        new Date(latest);

      cutoff.setDate(
        cutoff.getDate() - 2
      );

      return activeItems.filter(item => {
        if (!item.date) {
          return false;
        }

        const itemDate =
          new Date(
            `${item.date}T00:00:00+09:00`
          );

        return (
          itemDate >= cutoff &&
          itemDate <= latest
        );
      });
    }

    function setLanguage(lang) {
      currentLanguage = lang;
      document.documentElement.lang = lang;

      document
        .getElementById("ja-btn")
        .classList
        .toggle("active", lang === "ja");

      document
        .getElementById("en-btn")
        .classList
        .toggle("active", lang === "en");

      document.getElementById("app-description").textContent =
        translations[lang].description;

      document.getElementById("meeting-section-title").textContent =
        translations[lang].meetingTitle;

      document.getElementById("theme-label").textContent =
        translations[lang].themeLabel;

      document.getElementById("presenter-label").textContent =
        translations[lang].presenterLabel;

      document.getElementById("zoom-button").textContent =
        translations[lang].zoomButton;

      document.getElementById("chat-button").textContent =
        translations[lang].chatButton;

      document.getElementById("recommendations-section-title").textContent =
        translations[lang].recommendationsTitle;

      document.getElementById("main-sites-title").textContent =
        translations[lang].sitesTitle;

      document.getElementById("share-section-title").textContent =
        translations[lang].shareTitle;

      document.getElementById("share-text").textContent =
        translations[lang].shareText;

      document.getElementById("footer-text").textContent =
        translations[lang].footer;

      renderMeeting();
      renderRecommendations();
      renderSites();

      localStorage.setItem(
        "language",
        lang
      );
    }

    async function loadMeeting() {
      try {
        const response =
          await fetch(
            "./meeting.json",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "meeting.json HTTP error: " +
            response.status
          );
        }

        meetingData =
          await response.json();

        renderMeeting();

      } catch (error) {
        console.error(error);

        document
          .getElementById("meeting-section")
          .hidden = true;
      }
    }

    function renderMeeting() {
      const section =
        document.getElementById(
          "meeting-section"
        );

      if (
        !meetingData ||
        !meetingData.active
      ) {
        section.hidden = true;
        return;
      }

      section.hidden = false;

      const name =
        currentLanguage === "ja"
          ? meetingData.title_ja
          : meetingData.title_en;

      const date =
        currentLanguage === "ja"
          ? meetingData.date_ja
          : meetingData.date_en;

      const themes =
        currentLanguage === "ja"
          ? meetingData.themes_ja
          : meetingData.themes_en;

      const presenters =
        currentLanguage === "ja"
          ? meetingData.presenters_ja
          : meetingData.presenters_en;

      document.getElementById(
        "meeting-name"
      ).textContent =
        name || "";

      document.getElementById(
        "meeting-date"
      ).textContent =
        `${date || ""} ${meetingData.time || ""}〜`;

      document.getElementById(
        "meeting-themes"
      ).innerHTML =
        Array.isArray(themes)
          ? themes
              .map(
                item =>
                  `<li>${escapeHTML(item)}</li>`
              )
              .join("")
          : "";

      document.getElementById(
        "meeting-presenters"
      ).innerHTML =
        Array.isArray(presenters)
          ? presenters
              .map(
                item =>
                  `<li>${escapeHTML(item)}</li>`
              )
              .join("")
          : "";

      const zoomButton =
        document.getElementById(
          "zoom-button"
        );

      const chatButton =
        document.getElementById(
          "chat-button"
        );

      const zoomUrl =
        safeUrl(meetingData.zoom_url);

      const chatUrl =
        safeUrl(meetingData.chat_url);

      if (zoomUrl) {
        zoomButton.href = zoomUrl;
        zoomButton.hidden = false;
      } else {
        zoomButton.hidden = true;
      }

      if (chatUrl) {
        chatButton.href = chatUrl;
        chatButton.hidden = false;
      } else {
        chatButton.hidden = true;
      }
    }

    async function loadRecommendations() {
      const container =
        document.getElementById(
          "recommendations-grid"
        );

      container.innerHTML = `
        <div class="loading">
          ${translations[currentLanguage].loadingRecommendations}
        </div>
      `;

      try {
        const response =
          await fetch(
            "./recommendations.json",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "recommendations.json HTTP error: " +
            response.status
          );
        }

        recommendationsData =
          await response.json();

        if (
          !recommendationsData ||
          !Array.isArray(
            recommendationsData.ichimizu_columns
          ) ||
          !Array.isArray(
            recommendationsData.daily_brief
          )
        ) {
          throw new Error(
            "recommendations.json has an invalid structure"
          );
        }

        renderRecommendations();

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="loading">
            ${translations[currentLanguage].errorRecommendations}
          </div>
        `;
      }
    }

    function createRecommendationCard(
      item,
      type,
      showDate
    ) {
      if (!item) {
        return "";
      }

      const title =
        currentLanguage === "ja"
          ? item.title_ja
          : item.title_en;

      const summary =
        currentLanguage === "ja"
          ? item.summary_ja
          : item.summary_en;

      const url =
        currentLanguage === "ja"
          ? item.url_ja
          : item.url_en;

      const typeLabel =
        type === "column"
          ? translations[currentLanguage].columnType
          : translations[currentLanguage].dailyType;

      const safeLink =
        safeUrl(url);

      return `
        <article class="recommendation-card">
          <div class="recommendation-type">
            ${escapeHTML(typeLabel)}
          </div>

          ${
            showDate && item.date
              ? `
                <div class="recommendation-date">
                  ${escapeHTML(formatDate(item.date))}
                </div>
              `
              : ""
          }

          <div class="recommendation-title">
            ${escapeHTML(title)}
          </div>

          <div class="recommendation-summary">
            ${escapeHTML(summary)}
          </div>

          ${
            safeLink
              ? `
                <a
                  class="recommendation-link"
                  href="${escapeHTML(safeLink)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${escapeHTML(
                    translations[currentLanguage].readMore
                  )}
                </a>
              `
              : ""
          }
        </article>
      `;
    }

    function renderRecommendations() {
      const container =
        document.getElementById(
          "recommendations-grid"
        );

      if (!container) {
        return;
      }

      const columns =
        recommendationsData.ichimizu_columns
          .filter(
            item => item.active !== false
          );

      const recentBriefs =
        getRecentDailyBriefItems(
          recommendationsData.daily_brief
        );

      const japanDate =
        getJapanDateKey();

      const selectedColumn =
        selectDailyItem(
          columns,
          `column-${japanDate}`
        );

      const selectedBrief =
        selectDailyItem(
          recentBriefs,
          `daily-${japanDate}`
        );

      const cards = [
        createRecommendationCard(
          selectedColumn,
          "column",
          false
        ),
        createRecommendationCard(
          selectedBrief,
          "daily",
          true
        )
      ].filter(Boolean);

      if (!cards.length) {
        document
          .getElementById(
            "recommendations-section"
          )
          .hidden = true;

        return;
      }

      document
        .getElementById(
          "recommendations-section"
        )
        .hidden = false;

      container.innerHTML =
        cards.join("");
    }

    async function loadSites() {
      const container =
        document.getElementById(
          "sites-grid"
        );

      container.innerHTML = `
        <div class="loading">
          ${translations[currentLanguage].loadingSites}
        </div>
      `;

      try {
        const response =
          await fetch(
            "./sites.json",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "sites.json HTTP error: " +
            response.status
          );
        }

        sitesData =
          await response.json();

        if (!Array.isArray(sitesData)) {
          throw new Error(
            "sites.json is not an array"
          );
        }

        renderSites();

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="loading">
            ${translations[currentLanguage].errorSites}
          </div>
        `;
      }
    }

    function renderSites() {
      const container =
        document.getElementById(
          "sites-grid"
        );

      if (
        !container ||
        !sitesData.length
      ) {
        return;
      }

      container.innerHTML =
        sitesData
          .map(item => {
            const title =
              currentLanguage === "ja"
                ? item.title_ja
                : item.title_en;

            const description =
              currentLanguage === "ja"
                ? item.description_ja
                : item.description_en;

            const category =
              currentLanguage === "ja"
                ? item.category_ja
                : item.category_en;

            const url =
              currentLanguage === "ja"
                ? item.url_ja
                : item.url_en;

            const isPreparing =
              item.status === "preparing";

            const safeLink =
              safeUrl(url);

            const updatedContent =
              item.updated &&
              !isPreparing
                ? `
                  <div class="updated">
                    ${escapeHTML(
                      translations[currentLanguage].updatedLabel
                    )}：
                    ${escapeHTML(
                      formatDate(item.updated)
                    )}
                  </div>
                `
                : "";

            const content = `
              <div class="card-title">
                ${escapeHTML(title)}
              </div>

              <div class="card-description">
                ${escapeHTML(description)}
              </div>

              <div class="card-meta">
                <span class="tag">
                  ${escapeHTML(category)}
                </span>

                ${
                  isPreparing
                    ? `
                      <span class="preparing-label">
                        ${escapeHTML(
                          translations[currentLanguage]
                            .preparingLabel
                        )}
                      </span>
                    `
                    : ""
                }

                ${updatedContent}
              </div>
            `;

            if (
              isPreparing ||
              !safeLink
            ) {
              return `
                <div class="card preparing">
                  ${content}
                </div>
              `;
            }

            return `
              <a
                class="card"
                href="${escapeHTML(safeLink)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${content}
              </a>
            `;
          })
          .join("");
    }

    document
      .getElementById("ja-btn")
      .addEventListener(
        "click",
        () => {
          setLanguage("ja");
        }
      );

    document
      .getElementById("en-btn")
      .addEventListener(
        "click",
        () => {
          setLanguage("en");
        }
      );

    setLanguage(currentLanguage);

    loadMeeting();
    loadRecommendations();
    loadSites();

    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(error => {
              console.error(
                "Service Worker registration failed:",
                error
              );
            });
        }
      );
    }
  </script>

</body>
</html>
